      required: [fileName, contentType, contentLength]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/png, image/jpeg] }
        contentLength: { type: integer, minimum: 1, maximum: 10485760 }
    ConfirmDrawingRequest:
      type: object
      required: [objectKey, contentType]
      properties:
        objectKey: { type: string, minLength: 1, maxLength: 500 }
        contentType: { type: string, enum: [image/png, image/jpeg] }
    SuggestionStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [SELECTED, HIDDEN] }
    DiaryGenerationRequest:
      type: object
      properties:
        memoContent: { type: [string, 'null'], maxLength: 5000 }
    DiaryUpdateRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 378 }
    MemoRequest:
      type: object
      required: [memoContent]
      properties:
        memoContent: { type: string, maxLength: 5000 }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: UP }
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string }
