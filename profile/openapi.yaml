        application/json:
          schema: { $ref: '#/components/schemas/SuggestionListResponse' }
    SuggestionSuccess:
      description: 대화 제안 상태 변경 결과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuggestionResponse' }
    DiaryListSuccess:
      description: 그림일기 목록
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryListResponse' }
    DiarySuccess:
      description: 그림일기 상세 정보
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryResponse' }
    DiaryGenerationAccepted:
      description: 그림일기 생성 요청 접수 결과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryGenerationResponse' }
    DiaryStatusAccepted:
      description: 그림일기 생성 재시도 접수 결과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryStatusResponse' }
    DiaryStatusSuccess:
      description: 그림일기 상태 변경 결과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryStatusResponse' }
    MemoSuccess:
      description: 부모 메모
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MemoResponse' }
  schemas:
    ApiSuccessBase:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        error: { type: 'null' }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AuthData' }
    CsrfTokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [token, headerName]
              properties:
                token: { type: string }
                headerName: { type: string, example: X-XSRF-TOKEN }
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/TokenData' }
    ParentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Parent' }
    ChildResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Child' }
    ChildListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/ChildListData' }
    DefaultProfileImageListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/DefaultProfileImageListData' }
    InterestListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/InterestListData' }
    ChildInterestsResponse:
      allOf:
