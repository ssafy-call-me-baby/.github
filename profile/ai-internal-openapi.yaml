openapi: 3.1.0
info:
  title: CallMeBaby AI Internal API
  version: 1.0.0
  license:
    name: Private MVP Project
    identifier: Proprietary
  description: |
    Spring Boot와 LiveKit AI Agent가 실시간 토픽 AI 서버를 호출할 때 사용하는 내부 계약입니다.
    브라우저에 공개하지 않으며, 사용자 인증과 아이·통화방 소유권 검증은 Spring에서 먼저 수행합니다.

    확정된 아이 STT만 분석하고 AI 결과로 지속 관심사를 자동 등록하지 않습니다.
    `CONTINUE`와 `SKIP`은 현재 통화의 대화 선호 신호이며 최종 관심사 판단은 부모 확인을 거칩니다.

    모든 세션 변경 요청은 멱등 식별자를 사용합니다.
    같은 식별자와 같은 payload의 재전송은 기존 결과를 반환하고, 같은 식별자의 다른 payload는 `400`으로 거절합니다.
servers:
  - url: http://localhost:8001
    description: 로컬 AI API
  - url: http://ai-api:8001
    description: 내부 컨테이너 네트워크
tags:
  - name: Topic Sessions
    description: 통화 중 토픽 후보·질문 노출·부모 응답 세션 관리
  - name: Diaries
    description: 통화 종료 후 근거 기반 그림일기 생성
  - name: Health
    description: AI 프로세스와 Redis 준비 상태 확인
security:
  - internalApiKey: []
x-public-api-mapping:
  spec: ./openapi.yaml
  description: 공개 Conversation Suggestions API와 AI 내부 상태의 변환은 Spring이 담당합니다.
  decisions:
    SELECTED: CONTINUE
    HIDDEN: SKIP
paths:
  /internal/ai/topic-sessions/events:
    post:
      tags: [Topic Sessions]
      operationId: analyzeTopicSessionEvent
      summary: 확정 아이 STT 분석·누적
      description: |
        확정된 아이 STT 한 건에서 토픽 후보를 추출하고 Redis 통화 세션에 누적합니다.
        `event.eventId`가 멱등 키이며 같은 이벤트 재전송 시 `duplicateEvent=true`를 반환합니다.
        응답의 `realtimePromptEligible=true`는 부모에게 토픽 확인 문구를 노출할 수 있다는 의미이며
        아이의 지속 관심사로 확정됐다는 의미가 아닙니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyzeEventRequest' }
            examples:
              dinosaurTopic:
                value:
                  event:
                    schemaVersion: '1.0'
                    eventId: evt-001
                    callRoomId: 101
                    childId: 7
                    utteranceIndex: 3
                    speaker: CHILD
                    isFinal: true
                    text: 공룡이 제일 좋아
                  activeInterests:
                    - interestId: 11
                      interestKey: WILD_ANIMALS
                      name: 야생동물
                      category: 생명·자연·과학
      responses:
        '200': { $ref: '#/components/responses/ProcessEventSuccess' }
        '400': { $ref: '#/components/responses/DomainError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/StoreUnavailableError' }
  /internal/ai/topic-sessions/{callRoomId}/prompts:
    parameters:
      - { $ref: '#/components/parameters/CallRoomId' }
    post:
      tags: [Topic Sessions]
      operationId: markTopicPromptExposed
      summary: 부모 토픽 확인 문구 노출 기록
      description: |
        부모 화면에 토픽 확인 문구가 실제로 노출된 시점을 기록하고 해당 토픽의 쿨다운을 시작합니다.
        `promptId`가 멱등 키입니다. 토픽 탐지만으로는 이 API를 호출하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptExposedRequest' }
            example:
              childId: 7
              promptId: prompt-001
              topicKey: DINOSAURS
              sourceEventId: evt-001
      responses:
        '200': { $ref: '#/components/responses/PromptActionSuccess' }
        '400': { $ref: '#/components/responses/DomainError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/StoreUnavailableError' }
  /internal/ai/topic-sessions/{callRoomId}/decisions:
    parameters:
      - { $ref: '#/components/parameters/CallRoomId' }
    post:
      tags: [Topic Sessions]
      operationId: recordTopicPromptDecision
      summary: 부모의 현재 대화 선호 기록
      description: |
        부모의 `CONTINUE` 또는 `SKIP` 응답을 노출된 prompt에 연결합니다.
        공개 API의 `SELECTED`는 `CONTINUE`, `HIDDEN`은 `SKIP`으로 변환합니다.
        `decisionId`가 멱등 키이며 한 prompt의 결정을 다른 값으로 덮어쓸 수 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentDecisionRequest' }
            example:
              childId: 7
              promptId: prompt-001
              decisionId: decision-001
              decision: CONTINUE
      responses:
        '200': { $ref: '#/components/responses/DecisionActionSuccess' }
        '400': { $ref: '#/components/responses/DomainError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/StoreUnavailableError' }
  /internal/ai/topic-sessions/{callRoomId}/questions:
    parameters:
      - { $ref: '#/components/parameters/CallRoomId' }
    post:
      tags: [Topic Sessions]
      operationId: generateTopicQuestions
      summary: 선택한 토픽의 후속 질문 생성
      description: |
        부모가 `CONTINUE`로 선택한 토픽에 대해 2~3개의 후속 질문을 생성합니다.
        Spring은 `childId`, 노출된 토픽 확인 문구의 `promptId`, `questionSetId`, 질문 개수만 전달합니다.
        AI는 Redis 세션에서 토픽, 근거 발화, 기존 관심사 관계를 직접 복원합니다.

        `questionSetId`는 생성 요청 멱등 키입니다. 같은 ID와 같은 요청의 재전송은 저장된
        결과를 반환하며, 다른 payload에 같은 ID를 사용하면 `400`으로 거절합니다.
        생성된 질문은 Redis 세션에 저장하고 같은 토픽의 다음 생성에서 제외합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionGenerationRequest' }
            example:
              childId: 7
              promptId: prompt-001
              questionSetId: questions-001
              count: 3
      responses:
        '200': { $ref: '#/components/responses/QuestionGenerationSuccess' }
        '400': { $ref: '#/components/responses/DomainError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/QuestionPoolExhaustedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/StoreUnavailableError' }
  /internal/ai/topic-sessions/{callRoomId}/interest-candidates:
    parameters:
      - { $ref: '#/components/parameters/CallRoomId' }
    post:
      tags: [Topic Sessions]
      operationId: summarizePostCallInterestCandidates
      summary: 통화 후 부모 확인용 관심사 후보 종합
      description: |
        Redis 토픽 세션에 누적된 반복 발화, 명시적 선호, `CONTINUE/SKIP`, 기존 ACTIVE
        관심사 관계를 종합합니다. 결과는 관심사를 자동 등록하지 않으며 Spring이 `PENDING`
        후보로 저장한 뒤 부모가 최종 승인하거나 거절합니다.

        같은 세션 상태에는 같은 후보와 점수를 반환하는 읽기 전용 연산입니다. 원문 발화는
        부모에게 근거를 제시하기 위한 내부 응답에만 포함하며 운영 로그에는 남기지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostCallInterestCandidatesRequest' }
            example:
              childId: 7
      responses:
        '200': { $ref: '#/components/responses/PostCallInterestCandidatesSuccess' }
        '400': { $ref: '#/components/responses/DomainError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/StoreUnavailableError' }
  /internal/ai/topic-sessions/{callRoomId}:
    parameters:
      - { $ref: '#/components/parameters/CallRoomId' }
      - { $ref: '#/components/parameters/ChildIdQuery' }
    get:
      tags: [Topic Sessions]
      operationId: getTopicSession
      summary: 현재 토픽 세션 조회
      description: 통화 중 누적된 토픽·발화·부모 응답 요약을 조회합니다. 조회는 Redis TTL을 갱신하지 않습니다.
      responses:
        '200': { $ref: '#/components/responses/SessionSuccess' }
        '400': { $ref: '#/components/responses/DomainError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/StoreUnavailableError' }
  /internal/ai/diaries/generate:
    post:
      tags: [Diaries]
      operationId: generatePictureDiary
      summary: 확정 STT·채택 토픽·부모 메모 기반 그림일기 생성
      description: |
        Spring이 소유권과 종료 상태를 확인한 뒤 호출합니다. `selectedTopics`에는 통화 중
        부모가 `CONTINUE`로 채택한 토픽만 전달합니다. STT·토픽·메모는 비신뢰 인용
        자료로 처리하며 출력 본문은 공백과 문장부호를 포함해 378자 이하입니다.
        모델 호출이나 생성·보정 검증이 실패하면 성공 본문을 반환하지 않습니다. 호환성을 위해
        유지하는 `fallbackUsed`는 성공 응답에서 항상 `false`입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryGenerationRequest' }
      responses:
        '200': { $ref: '#/components/responses/DiaryGenerationSuccess' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /internal/ai/stt/transcriptions:
    post:
      tags: [STT]
      operationId: transcribeAudio
      summary: 음성 파일을 텍스트로 변환
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV, FLAC 또는 OGG 음성 파일
      responses:
        '200':
          description: 변환 결과
          content:
            application/json:
              schema:
                type: object
                description: success/data/error 공통 응답. data에는 transcription과 처리 시간이 포함됩니다.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '413': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/StoreUnavailableError' }
  /internal/stt-agents:
    get:
      tags: [STT Agent Manager]
      operationId: listSttAgents
      summary: 실행 중인 STT Agent 목록 조회
      security:
        - internalApiKey: []
      responses:
        '200':
          description: 실행 중인 Agent 목록
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      tags: [STT Agent Manager]
      operationId: startSttAgent
      summary: 통화방 STT Agent 시작
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [callRoomId, childId]
              properties:
                callRoomId: { type: integer, minimum: 1 }
                childId: { type: integer, minimum: 1 }
      responses:
        '200': { description: Agent 시작 결과 }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/DomainError' }
  /internal/stt-agents/{callRoomId}/stop:
    post:
      tags: [STT Agent Manager]
      operationId: stopSttAgent
      summary: 통화방 STT Agent 중지
      security:
        - internalApiKey: []
      parameters:
        - name: callRoomId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Agent 중지 결과 }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '400': { $ref: '#/components/responses/DomainError' }
  /health/live:
    get:
      tags: [Health]
      operationId: getAiLiveness
      summary: AI 프로세스 생존 확인
      security: []
      responses:
        '200': { $ref: '#/components/responses/HealthSuccess' }
  /health/ready:
    get:
      tags: [Health]
      operationId: getAiReadiness
      summary: Redis 요청 처리 준비 상태 확인
      security: []
      responses:
        '200': { $ref: '#/components/responses/HealthSuccess' }
        '503': { $ref: '#/components/responses/NotReadyError' }
components:
  securitySchemes:
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: 32자 이상의 Spring·AI 서비스 전용 키. 브라우저·로그·저장소에 노출하지 않습니다.
  parameters:
    CallRoomId:
      name: callRoomId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ChildIdQuery:
      name: childId
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    DiaryGenerationSuccess:
      description: 378자 본문 제약을 통과한 그림일기
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DiaryGenerationResponse' }
    ProcessEventSuccess:
      description: STT 분석 및 세션 누적 결과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProcessEventResponse' }
    PromptActionSuccess:
      description: 질문 노출 기록 결과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PromptActionResponse' }
    DecisionActionSuccess:
      description: 부모 응답 기록 결과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DecisionActionResponse' }
    QuestionGenerationSuccess:
      description: 검증을 통과한 토픽 후속 질문
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QuestionGenerationResponse' }
    PostCallInterestCandidatesSuccess:
      description: 부모 확인 대상으로 선정된 통화 후 관심사 후보와 제외 근거
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PostCallInterestCandidatesResponse' }
    SessionSuccess:
      description: 현재 토픽 세션
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionResponse' }
    DeleteSessionSuccess:
      description: 토픽 세션 삭제 결과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DeleteSessionResponse' }
    HealthSuccess:
      description: 서비스 정상
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HealthResponse' }
    UnauthorizedError:
      description: 내부 API 키 누락 또는 불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            data: null
            error:
              code: UNAUTHORIZED
              message: internal API key is invalid
              details: null
    DomainError:
      description: 멱등 키 충돌, 세션 없음, 아이·통화방 불일치 등 도메인 요청 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            data: null
            error:
              code: INVALID_TOPIC_SESSION_REQUEST
              message: topic session was not found
              details: null
    ValidationError:
      description: 요청 스키마 검증 실패. 원문 STT 입력값은 오류 응답에서 제외합니다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            data: null
            error:
              code: VALIDATION_ERROR
              message: request validation failed
              details:
                - location: [body, event, speaker]
                  message: Input should be 'CHILD'
                  type: literal_error
    StoreUnavailableError:
      description: Redis 연결 실패 또는 세션 저장소 충돌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            data: null
            error:
              code: TOPIC_SESSION_STORE_UNAVAILABLE
              message: topic session store is unavailable
              details: null
    QuestionPoolExhaustedError:
      description: 최근 사용 질문을 제외한 질문 풀이 부족함
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            data: null
            error:
              code: QUESTION_POOL_EXHAUSTED
              message: no unused questions are available
              details: null
    NotReadyError:
      description: Redis 연결 불가
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            data: null
            error:
              code: NOT_READY
              message: Redis is unavailable
              details: null
  schemas:
    AnalyzeEventRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { $ref: '#/components/schemas/FinalChildSttEvent' }
        activeInterests:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/ActiveInterest' }
    FinalChildSttEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, callRoomId, childId, utteranceIndex, speaker, isFinal, text]
      properties:
        schemaVersion: { type: string, const: '1.0' }
        eventId:
          type: string
          minLength: 1
          maxLength: 128
          description: STT 이벤트 멱등 키
        callRoomId: { type: integer, minimum: 1 }
        childId: { type: integer, minimum: 1 }
        utteranceIndex: { type: integer, minimum: 0 }
        speaker: { type: string, const: CHILD }
        isFinal: { type: boolean, const: true }
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: 확정된 아이 STT. 로그와 오류 응답에 원문을 남기지 않습니다.
    ActiveInterest:
      type: object
      additionalProperties: false
      required: [interestId, name]
      properties:
        interestId: { type: integer, minimum: 1 }
        interestKey: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 100 }
        category: { type: [string, 'null'], maxLength: 100 }
    PromptExposedRequest:
      type: object
      additionalProperties: false
      required: [childId, promptId, topicKey, sourceEventId]
      properties:
        childId: { type: integer, minimum: 1 }
        promptId:
          type: string
          minLength: 1
          maxLength: 128
          description: 질문 노출 멱등 키
        topicKey: { type: string, minLength: 1, maxLength: 128 }
        sourceEventId: { type: string, minLength: 1, maxLength: 128 }
    ParentDecisionRequest:
      type: object
      additionalProperties: false
      required: [childId, promptId, decisionId, decision]
      properties:
        childId: { type: integer, minimum: 1 }
        promptId: { type: string, minLength: 1, maxLength: 128 }
        decisionId:
          type: string
          minLength: 1
          maxLength: 128
          description: 부모 응답 멱등 키
        decision: { $ref: '#/components/schemas/RealtimeDecision' }
    QuestionGenerationRequest:
      type: object
      additionalProperties: false
